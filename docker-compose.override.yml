services:
  web:
    ports:
      - "${APP_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION}

  sqlserver:
    ports:
      - "${DB_PORT}:1433"

  redis:
    ports:
      - "${REDIS_PORT}:6379"